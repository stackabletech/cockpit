---
name: PR Checks

permissions:
  contents: read

on:
  pull_request:
  merge_group:

jobs:
  pre-commit:
    name: Pre-commit Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          node-version-file: '.node-version'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Compile Paraglide messages
        run: npx @inlang/paraglide-js compile --project ./project.inlang --outdir ./src/lib/paraglide

      - name: Install hadolint
        run: |
          set -euo pipefail
          HADOLINT_VERSION=v2.14.0
          SYSTEM=$(uname -s)
          ARCH=$(uname -m)
          mkdir -p "$HOME/.local/bin"
          curl -sL -o "$HOME/.local/bin/hadolint" "https://github.com/hadolint/hadolint/releases/download/${HADOLINT_VERSION}/hadolint-$SYSTEM-$ARCH"
          chmod 755 "$HOME/.local/bin/hadolint"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install Helm
        uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1

      - name: Run pre-commit
        uses: pre-commit/action@2c7b3805fd2a0fd8c1884dcaebf91fc102a13ecd # v3.0.1

  e2e-with-garage:
    name: E2E Tests with Garage S3
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          node-version-file: '.node-version'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox

      - name: Start Garage S3 and initialize bucket
        run: |
          APP_KEY_ID="GK$(openssl rand -hex 16)"
          APP_SECRET=$(openssl rand -hex 32)

          # Start Garage — server and --single-node are entrypoint args, not docker flags,
          # so they must be passed after the image name via docker run rather than via
          # service container options.
          docker run -d --name garage \
            -p 3900:3900 \
            -e GARAGE_CONFIG_FILE=/workspace/e2e/garage.toml \
            -e GARAGE_DEFAULT_ACCESS_KEY="$APP_KEY_ID" \
            -e GARAGE_DEFAULT_SECRET_KEY="$APP_SECRET" \
            -e GARAGE_DEFAULT_BUCKET=test-bucket \
            -v "$PWD:/workspace" \
            --entrypoint /garage \
            docker.io/dxflrs/garage:v2.3.0 \
            server --single-node --default-bucket

          # Wait for the S3 API to become available
          for _ in $(seq 1 30); do
            if curl -s http://localhost:3900 >/dev/null 2>&1; then
              break
            fi
            sleep 1
          done

          # Write config file for Playwright to read (Playwright should read 's3-config.json' from the root of the project)
          cat > s3-config.json <<EOF
          {
            "awsEndpoint": "http://localhost:3900",
            "awsRegion": "garage",
            "awsAccessKeyId": "$APP_KEY_ID",
            "awsSecretAccessKey": "$APP_SECRET",
            "bucket": "test-bucket"
          }
          EOF

      - name: Run E2E tests with Garage
        run: npm run test:e2e:garage

      - name: Debug - print config
        run: cat s3-config.json
        if: failure()
