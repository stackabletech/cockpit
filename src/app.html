<!doctype html>
<html lang="%paraglide.lang%">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%sveltekit.assets%/favicon-32x32.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script>
      (function () {
        var theme =
          localStorage.getItem('theme') ||
          (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        document.documentElement.setAttribute('data-theme', theme);

        var savedWidth = localStorage.getItem('storage_sidebar_width');
        if (savedWidth) {
          var w = parseInt(savedWidth, 10);
          if (!isNaN(w) && w >= 120 && w <= 480) {
            document.documentElement.style.setProperty('--storage-sidebar-width', w + 'px');
          }
        }
      })();
    </script>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="off">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
