<!doctype html>
<html lang="%paraglide.lang%">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%sveltekit.assets%/favicon-32x32.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script>
      (function () {
        // localStorage throws when site data is blocked; fall back to the defaults then.
        var savedTheme = null;
        try {
          savedTheme = localStorage.getItem('theme');
        } catch (e) {}
        var theme =
          savedTheme ||
          (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        document.documentElement.setAttribute('data-theme', theme);

        // Restore resizable panel widths before first paint (see resizable-panel.svelte.ts).
        // Each panel clamps its variable to its own limits in CSS.
        try {
          for (var i = 0; i < localStorage.length; i++) {
            var key = localStorage.key(i);
            var match = key && /^panel_width:([A-Za-z0-9-]+)$/.exec(key);
            var w = match && parseInt(localStorage.getItem(key), 10);
            if (w > 0) {
              document.documentElement.style.setProperty('--panel-width-' + match[1], w + 'px');
            }
          }
        } catch (e) {}
      })();
    </script>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="off">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
