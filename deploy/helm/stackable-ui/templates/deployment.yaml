apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "stackable-ui.fullname" . }}
  labels:
    {{- include "stackable-ui.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "stackable-ui.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "stackable-ui.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "stackable-ui.serviceAccountName" . }}
      {{- with .Values.terminationGracePeriodSeconds }}
      terminationGracePeriodSeconds: {{ . }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ .Chart.Name }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: {{ include "stackable-ui.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.targetPort }}
              protocol: TCP
          livenessProbe:
            {{- toYaml .Values.livenessProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.readinessProbe | nindent 12 }}
          {{- with .Values.startupProbe }}
          startupProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          env:
            - name: NODE_ENV
              value: {{ .Values.config.nodeEnv | quote }}
            - name: PORT
              value: {{ .Values.service.targetPort | quote }}
            - name: STACKABLE_UI_SESSION_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "stackable-ui.fullname" . }}
                  key: session-secret
            - name: STACKABLE_UI_OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "stackable-ui.fullname" . }}
                  key: oidc-client-secret
            - name: STACKABLE_UI_BASE_URL
              valueFrom:
                configMapKeyRef:
                  name: {{ include "stackable-ui.fullname" . }}
                  key: base-url
            - name: STACKABLE_UI_OIDC_DISCOVERY_URL
              valueFrom:
                configMapKeyRef:
                  name: {{ include "stackable-ui.fullname" . }}
                  key: oidc-discovery-url
            - name: STACKABLE_UI_OIDC_CLIENT_ID
              valueFrom:
                configMapKeyRef:
                  name: {{ include "stackable-ui.fullname" . }}
                  key: oidc-client-id
            - name: STACKABLE_UI_SQLITE_PATH
              value: {{ .Values.config.databasePath | quote }}
            {{- if .Values.auth.usernameClaim }}
            - name: STACKABLE_UI_OIDC_USERNAME_CLAIM
              value: {{ .Values.auth.usernameClaim | quote }}
            {{- end }}
            {{- if .Values.trino.url }}
            - name: STACKABLE_UI_TRINO_URL
              valueFrom:
                configMapKeyRef:
                  name: {{ include "stackable-ui.fullname" . }}
                  key: trino-url
            {{- end }}
            {{- if .Values.trino.authType }}
            - name: STACKABLE_UI_TRINO_AUTH_TYPE
              valueFrom:
                configMapKeyRef:
                  name: {{ include "stackable-ui.fullname" . }}
                  key: trino-auth-type
            {{- end }}
            {{- if .Values.trino.authUsername }}
            - name: STACKABLE_UI_TRINO_AUTH_USERNAME
              valueFrom:
                configMapKeyRef:
                  name: {{ include "stackable-ui.fullname" . }}
                  key: trino-auth-username
            {{- end }}
            {{- if .Values.trino.authPassword }}
            - name: STACKABLE_UI_TRINO_AUTH_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "stackable-ui.fullname" . }}
                  key: trino-auth-password
            {{- end }}
            {{- if .Values.trino.tlsInsecure }}
            - name: STACKABLE_UI_TRINO_TLS_INSECURE
              value: "true"
            {{- end }}
            {{- if .Values.trino.tlsCaCert }}
            - name: STACKABLE_UI_TRINO_TLS_CA_CERT
              value: {{ .Values.trino.tlsCaCert | quote }}
            {{- else if .Values.trino.tlsSecretClass }}
            - name: STACKABLE_UI_TRINO_TLS_CA_CERT
              value: /stackable/trino-tls/ca.crt
            {{- end }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: data
              mountPath: /data
            {{- if .Values.trino.tlsSecretClass }}
            - name: trino-tls
              mountPath: /stackable/trino-tls
              readOnly: true
            {{- end }}
      volumes:
        - name: tmp
          emptyDir: {}
        {{- if .Values.trino.tlsSecretClass }}
        - name: trino-tls
          ephemeral:
            volumeClaimTemplate:
              metadata:
                annotations:
                  secrets.stackable.tech/class: {{ .Values.trino.tlsSecretClass | quote }}
                  secrets.stackable.tech/scope: pod
              spec:
                storageClassName: secrets.stackable.tech
                accessModes:
                  - ReadWriteOnce
                resources:
                  requests:
                    storage: 1
        {{- end }}
        - name: data
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ if .Values.persistence.existingClaim }}{{ .Values.persistence.existingClaim }}{{ else }}{{ include "stackable-ui.fullname" . }}-data{{ end }}
          {{- else }}
          emptyDir: {}
          {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
