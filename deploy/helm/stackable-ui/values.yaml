---
# Default values for stackable-ui

# NOTE: SQLite requires a single writer. Keep replicaCount at 1 when
# persistence.enabled is true to avoid concurrent-write corruption.
replicaCount: 1

image:
  registry: oci.stackable.tech
  repository: sdp/stackable-ui
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Automatically mount a ServiceAccount's API credentials?
  automount: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

podAnnotations: {}
podLabels: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 782252253
  runAsGroup: 574654813
  fsGroup: 782252253
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 782252253

service:
  type: ClusterIP
  port: 3000
  targetPort: 3000
  annotations: {}

ingress:
  enabled: false
  className: ""
  annotations: {}
    # cert-manager.io/cluster-issuer: letsencrypt-prod
    # kubernetes.io/tls-acme: "true"
  hosts:
    - host: stackable-ui.local
      paths:
        - path: /
          pathType: Prefix
  tls: []
  #  - secretName: stackable-ui-tls
  #    hosts:
  #      - stackable-ui.local

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 100m
    memory: 128Mi

livenessProbe:
  httpGet:
    path: /
    port: http
  initialDelaySeconds: 10
  periodSeconds: 30
  timeoutSeconds: 5
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /
    port: http
  initialDelaySeconds: 5
  periodSeconds: 10
  timeoutSeconds: 3
  failureThreshold: 3

startupProbe:
  httpGet:
    path: /
    port: http
  initialDelaySeconds: 5
  periodSeconds: 5
  failureThreshold: 12

terminationGracePeriodSeconds: 30

nodeSelector: {}

tolerations: []

affinity: {}

# Application configuration
config:
  # Node.js environment
  nodeEnv: production
  # SQLite database path inside the container (should be on the persistence volume)
  databasePath: "/data/auth.db"

# Session secret for signing cookies (auto-generated if not provided)
sessionSecret: ""

# OIDC authentication configuration
auth:
  # The publicly accessible base URL of this application (used for OIDC callback URLs)
  # Required. Example: https://stackable-ui.example.com
  baseUrl: ""
  # OIDC discovery URL (the full .well-known/openid-configuration URL)
  # Required. Example: https://your-idp.example.com/realms/your-realm/.well-known/openid-configuration
  discoveryUrl: ""
  # Client ID registered in the OIDC provider
  # Required.
  clientId: ""
  # Client secret registered in the OIDC provider
  # Required.
  clientSecret: ""
  # OIDC claim used as the username for Trino impersonation (default: preferred_username)
  usernameClaim: ""

# Optional: Pre-configure the Trino connection for all users.
# When trino.url is set, the connection form is hidden and the specified
# Trino endpoint is used automatically.
trino:
  # Trino coordinator URL (e.g. https://trino.example.com:8443)
  url: ""
  # Authentication type: "none" or "basic"
  authType: ""
  # Credentials for basic auth
  authUsername: ""
  authPassword: ""
  # TLS certificate verification
  tlsInsecure: false
  # Path to a custom CA certificate file (mounted via extraVolumes)
  tlsCaCert: ""
  # Stackable SecretClass name for provisioning the Trino CA certificate.
  # The Secret Operator mounts ca.crt into /stackable/trino-tls.
  tlsSecretClass: ""

# SQLite persistence for the Better Auth database.
# NOTE: Requires replicaCount: 1 — SQLite does not support concurrent writes from multiple pods.
persistence:
  enabled: true
  size: 1Gi
  # Storage class name. Leave empty to use the cluster default.
  storageClassName: ""
  accessMode: ReadWriteOnce
  # Set to reuse an existing PVC instead of creating a new one.
  existingClaim: ""
