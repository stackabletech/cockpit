---
# Default values for cockpit

replicaCount: 1

image:
  registry: oci.stackable.tech
  repository: sdp/cockpit
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Automatically mount a ServiceAccount's API credentials?
  automount: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

podAnnotations: {}
podLabels: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 782252253
  fsGroup: 782252253
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 782252253

service:
  type: ClusterIP
  port: 3000
  targetPort: 3000
  annotations: {}

ingress:
  enabled: false
  className: ""
  annotations: {}
    # cert-manager.io/cluster-issuer: letsencrypt-prod
    # kubernetes.io/tls-acme: "true"
  hosts:
    - host: cockpit.local
      paths:
        - path: /
          pathType: Prefix
  tls: []
  #  - secretName: cockpit-tls
  #    hosts:
  #      - cockpit.local

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 100m
    memory: 128Mi

livenessProbe:
  httpGet:
    path: /healthz
    port: http
  initialDelaySeconds: 10
  periodSeconds: 30
  timeoutSeconds: 5
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /healthz
    port: http
  initialDelaySeconds: 5
  periodSeconds: 10
  timeoutSeconds: 3
  failureThreshold: 3

startupProbe:
  httpGet:
    path: /healthz
    port: http
  initialDelaySeconds: 5
  periodSeconds: 5
  failureThreshold: 12

terminationGracePeriodSeconds: 30

# Optional feature toggles. All defaults below are applied by the application when omitted.
# features:
#   trino:
#     completion:
#       # Enable SQL code completion. Default: true (application default).
#       enabled: true
#   storage:
#     # Show the S3/HDFS file browser and enable routes under /storage. Default: false (application default).
#     enabled: false
#     # Show Cut, Copy, Paste and Rename and allow drag-and-drop move. The transfer API rejects
#     # copies, moves and renames while disabled. Default: false (application default).
#     transfer: false

logging:
  level: ""

# Additional volumes and container mounts, e.g. for a CA certificate referenced by
# trino.tls.caCert, database.tls.caCert or storage.tls.caCert.
extraVolumes: []
  # - name: database-ca
  #   secret:
  #     secretName: database-ca
extraVolumeMounts: []
  # - name: database-ca
  #   mountPath: /stackable/database-ca
  #   readOnly: true

# Additional environment variables for the Cockpit container, e.g. settings the chart does not expose.
extraEnv: []
  # - name: STACKABLE_COCKPIT_FILE_PREVIEW_ROWS
  #   value: "500"
# Additional sources of environment variables (ConfigMaps or Secrets) for the Cockpit container.
extraEnvFrom: []
  # - secretRef:
  #     name: cockpit-extra-env

nodeSelector: {}

tolerations: []

affinity: {}

# Application configuration
config:
  # Node.js environment
  nodeEnv: production
  # Maximum request body size (BODY_SIZE_LIMIT), e.g. "12M". Empty uses the image default (6M).
  # Must be at least the editable file size limit of the storage text editor (5 MiB by default).
  bodySizeLimit: ""

# Scratch volume mounted at /tmp, used for the archive preview cache.
tmp:
  # Size limit of the emptyDir. The kubelet evicts the pod when it is exceeded,
  # so keep it above storage.archiveCacheMaxMb (512 MB by default). Empty means no limit.
  sizeLimit: 1Gi

# Session secret for signing cookies. Chart auto-generates one if secretKeyRef.name is empty.
sessionSecret:
  secretKeyRef:
    name: ""
    key: session-secret

# PostgreSQL database (required). Stores sessions, users and storage connections.
# The chart does not deploy PostgreSQL; point it at an existing instance.
database:
  host: ""
  port: 5432
  name: cockpit
  user: cockpit
  # Required.
  password:
    secretKeyRef:
      name: ""
      key: database-password
  tls:
    # "verify-full" (verify certificate and host name), "require" (encrypt without
    # verification) or "disable". Empty uses the application default: verify-full when
    # config.nodeEnv is "production", otherwise disable.
    mode: ""
    # Path to a CA certificate file inside the container, e.g. mounted via extraVolumes.
    # Requires mode verify-full. Mutually exclusive with secretClass.
    caCert: ""
    # Stackable SecretClass name for provisioning the database CA certificate.
    # Requires mode verify-full. Mutually exclusive with caCert.
    # The Secret Operator mounts ca.crt into /stackable/database-tls.
    secretClass: ""

# Dashboard bookmarks.
bookmarks:
  # Bookmarks shown to every user, before their own. Users cannot change them.
  # productId (e.g. trino, superset or custom; unknown ids show as a custom link),
  # name (up to 40 characters) and an http(s) url are required; environment and
  # pinned are optional. Must be a YAML list, not a JSON string. Invalid entries stop
  # the application at startup.
  global: []
    # - productId: superset
    #   name: Dashboards
    #   url: https://superset.example.com
    #   environment: prod

# Storage browser settings that are not feature flags. Empty or omitted values use the application
# defaults; invalid values stop the application at startup.
storage:
  # Comma-separated page size options for paginated list views. Default: "25,50,100".
  pageSizes: ""
  # Page size selected when no user preference is stored. Must be included in pageSizes.
  # Default: the smallest page size.
  defaultPageSize: ""
  # Number of recently visited storage locations retained in local storage. Default: 15.
  maxRecentFiles: ""
  # Maximum parallel requests for file uploads. Default: 3.
  uploadConcurrency: ""
  # Objects copied at once within one copy, move or rename request. Default: 8.
  transferConcurrency: ""
  # Maximum bytes fetched for text, TSV, and JSON previews; editable text files are fetched
  # completely. Default: 262144.
  textPreviewBytes: ""
  # Maximum bytes fetched for image previews. Default: 5242880.
  imagePreviewBytes: ""
  # Maximum bytes fetched for PDF previews. Default: 26214400.
  pdfPreviewBytes: ""
  # Maximum rows in tabular file previews. Default: 250.
  filePreviewRows: ""
  # Maximum columns in tabular file previews. Default: 50.
  filePreviewColumns: ""
  # Maximum size in bytes of files that can be edited and saved in the text editor.
  # config.bodySizeLimit must be at least this large. Default: 5242880.
  maxEditableFileSize: ""
  # Maximum size in MB of an archive opened for preview, checked against its compressed size,
  # the total size of the listed entries and the size of an extracted entry. The archive cache
  # (archiveCacheMaxMb) is raised to at least twice this value. Default: 100.
  archivePreviewMaxMb: ""
  # Maximum total size in MB of the archive preview cache in /tmp. Keep it below tmp.sizeLimit.
  # Default: 512.
  archiveCacheMaxMb: ""
  # Comma-separated Parquet compression codecs that are not previewed. A "-no_offset" suffix
  # only blocks files without an offset index. Default: "gzip-no_offset".
  parquetPreviewDisallowedCompressionTypes: ""
  # Days a user's download history is kept. Integer from 1 to 3650. Default: 30.
  downloadHistoryRetentionDays: ""
  # Key that encrypts stored storage connection credentials: a 64-character hex string (32 bytes),
  # e.g. from `openssl rand -hex 32`. Required when features.storage.enabled is true.
  # Keep it stable: changing or losing it makes all stored credentials unreadable.
  encryptionKey:
    secretKeyRef:
      name: ""
      key: storage-encryption-key
  tls:
    # CA certificate for S3 connections with TLS verification. It replaces the system trust
    # store, so S3 endpoints with publicly trusted certificates fail while it is set.
    # Connections that disable verification ignore it.
    # Path to a CA certificate file inside the container, e.g. mounted via extraVolumes.
    # Mutually exclusive with secretClass.
    caCert: ""
    # Stackable SecretClass name for provisioning the S3 CA certificate.
    # Mutually exclusive with caCert.
    # The Secret Operator mounts ca.crt into /stackable/storage-tls.
    secretClass: ""

# SvelteKit CSRF origin
origin: "http://localhost:3000"

# Forwarded-header trust (set when behind a proxy/ingress/gateway/mesh)
proxy: {}
  # protocolHeader: x-forwarded-proto
  # hostHeader: x-forwarded-host

# Authentication configuration
auth:
  # Publicly accessible base URL (used for OIDC callback URLs)
  baseUrl: "http://localhost:3000"
  oidc:
    # Disable to deploy without authentication (e.g. local testing).
    enabled: true
    # OIDC discovery URL (the full .well-known/openid-configuration URL)
    # Required when enabled. Example: https://your-idp.example.com/realms/your-realm/.well-known/openid-configuration
    discoveryUrl: ""
    # Client ID registered in the OIDC provider. Required when enabled.
    clientId: ""
    # Required when enabled.
    clientSecret:
      secretKeyRef:
        name: ""
        key: oidc-client-secret
    # Extra OIDC scopes requested in addition to openid/profile/email.
    extraScopes: []

# Optional: Pre-configure the Trino connection for all users.
# When trino.url is set, the connection form is hidden and the specified
# Trino endpoint is used automatically.
trino:
  # Trino coordinator URL (e.g. https://trino.example.com:8443)
  url: ""
  # Browser-facing URL for "View in Trino" deep links. Defaults to trino.url.
  publicUrl: ""
  userImpersonation:
    # Forward the logged-in user to Trino as X-Trino-User. When false, all queries
    # run as trino.auth.username instead (requires basic auth).
    enabled: true
    # OIDC claim used as the Trino user. Only consumed when enabled and OIDC is on.
    userClaim: preferred_username
  auth:
    # Authentication type: "none" or "basic"
    type: ""
    username: ""
    # Required when type is "basic".
    password:
      secretKeyRef:
        name: ""
        key: trino-auth-password
  tls:
    # Skip TLS certificate verification. Cannot be combined with caCert or secretClass.
    insecure: false
    # Path to a CA certificate file inside the container, e.g. mounted via extraVolumes.
    # Mutually exclusive with secretClass.
    caCert: ""
    # Stackable SecretClass name for provisioning the Trino CA certificate.
    # Mutually exclusive with caCert.
    # The Secret Operator mounts ca.crt into /stackable/trino-tls.
    secretClass: ""
  # Query result TTL in seconds. Default: 1800 (application default).
  # queryTtl: 1800
