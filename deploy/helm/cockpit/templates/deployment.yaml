{{- include "cockpit.validateTls" . }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "cockpit.fullname" . }}
  labels:
    {{- include "cockpit.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "cockpit.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "cockpit.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "cockpit.serviceAccountName" . }}
      {{- with .Values.terminationGracePeriodSeconds }}
      terminationGracePeriodSeconds: {{ . }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ .Chart.Name }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: {{ include "cockpit.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.targetPort }}
              protocol: TCP
          livenessProbe:
            {{- toYaml .Values.livenessProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.readinessProbe | nindent 12 }}
          {{- with .Values.startupProbe }}
          startupProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          {{- $features := index .Values "features" | default dict }}
          {{- $trinoFeatures := index $features "trino" | default dict }}
          {{- $completion := index $trinoFeatures "completion" | default dict }}
          env:
            - name: NODE_ENV
              value: {{ .Values.config.nodeEnv | quote }}
            - name: PORT
              value: {{ .Values.service.targetPort | quote }}
            {{- with .Values.config.bodySizeLimit }}
            - name: BODY_SIZE_LIMIT
              value: {{ . | quote }}
            {{- end }}
            {{- if hasKey $completion "enabled" }}
            - name: STACKABLE_COCKPIT_COMPLETION_ENABLED
              value: {{ index $completion "enabled" | quote }}
            {{- end }}
            {{- with (index $features "storage") }}
            {{- if hasKey . "enabled" }}
            - name: STACKABLE_COCKPIT_STORAGE_BROWSER_ENABLED
              value: {{ .enabled | quote }}
            {{- end }}
            {{- if hasKey . "transfer" }}
            - name: PUBLIC_STACKABLE_COCKPIT_STORAGE_TRANSFER_ENABLED
              value: {{ .transfer | quote }}
            {{- end }}
            {{- end }}
            {{- if include "cockpit.isSet" .Values.storage.pageSizes }}
            - name: PUBLIC_STACKABLE_COCKPIT_PAGE_SIZES
              value: {{ include "cockpit.envValue" .Values.storage.pageSizes }}
            {{- end }}
            {{- if include "cockpit.isSet" .Values.storage.defaultPageSize }}
            - name: PUBLIC_STACKABLE_COCKPIT_DEFAULT_PAGE_SIZE
              value: {{ include "cockpit.envValue" .Values.storage.defaultPageSize }}
            {{- end }}
            {{- if include "cockpit.isSet" .Values.storage.maxRecentFiles }}
            - name: PUBLIC_STACKABLE_COCKPIT_MAX_RECENT_FILES
              value: {{ include "cockpit.envValue" .Values.storage.maxRecentFiles }}
            {{- end }}
            {{- if include "cockpit.isSet" .Values.storage.uploadConcurrency }}
            - name: PUBLIC_STACKABLE_COCKPIT_UPLOAD_CONCURRENCY
              value: {{ include "cockpit.envValue" .Values.storage.uploadConcurrency }}
            {{- end }}
            {{- if include "cockpit.isSet" .Values.storage.transferConcurrency }}
            - name: STACKABLE_COCKPIT_STORAGE_TRANSFER_CONCURRENCY
              value: {{ include "cockpit.envValue" .Values.storage.transferConcurrency }}
            {{- end }}
            {{- if include "cockpit.isSet" .Values.storage.textPreviewBytes }}
            - name: STACKABLE_COCKPIT_TEXT_PREVIEW_BYTES
              value: {{ include "cockpit.envValue" .Values.storage.textPreviewBytes }}
            {{- end }}
            {{- if include "cockpit.isSet" .Values.storage.imagePreviewBytes }}
            - name: STACKABLE_COCKPIT_IMAGE_PREVIEW_BYTES
              value: {{ include "cockpit.envValue" .Values.storage.imagePreviewBytes }}
            {{- end }}
            {{- if include "cockpit.isSet" .Values.storage.pdfPreviewBytes }}
            - name: STACKABLE_COCKPIT_PDF_PREVIEW_BYTES
              value: {{ include "cockpit.envValue" .Values.storage.pdfPreviewBytes }}
            {{- end }}
            {{- if include "cockpit.isSet" .Values.storage.filePreviewRows }}
            - name: STACKABLE_COCKPIT_FILE_PREVIEW_ROWS
              value: {{ include "cockpit.envValue" .Values.storage.filePreviewRows }}
            {{- end }}
            {{- if include "cockpit.isSet" .Values.storage.filePreviewColumns }}
            - name: STACKABLE_COCKPIT_FILE_PREVIEW_COLUMNS
              value: {{ include "cockpit.envValue" .Values.storage.filePreviewColumns }}
            {{- end }}
            {{- if include "cockpit.isSet" .Values.storage.maxEditableFileSize }}
            - name: PUBLIC_STACKABLE_COCKPIT_MAX_EDITABLE_FILE_SIZE
              value: {{ include "cockpit.envValue" .Values.storage.maxEditableFileSize }}
            {{- end }}
            {{- if include "cockpit.isSet" .Values.storage.archivePreviewMaxMb }}
            - name: STACKABLE_COCKPIT_ARCHIVE_PREVIEW_MAX_MB
              value: {{ include "cockpit.envValue" .Values.storage.archivePreviewMaxMb }}
            {{- end }}
            {{- if include "cockpit.isSet" .Values.storage.archiveCacheMaxMb }}
            - name: STACKABLE_COCKPIT_ARCHIVE_CACHE_MAX_MB
              value: {{ include "cockpit.envValue" .Values.storage.archiveCacheMaxMb }}
            {{- end }}
            {{- if include "cockpit.isSet" .Values.storage.parquetPreviewDisallowedCompressionTypes }}
            - name: STACKABLE_COCKPIT_PARQUET_PREVIEW_DISALLOWED_COMPRESSION_TYPES
              value: {{ include "cockpit.envValue" .Values.storage.parquetPreviewDisallowedCompressionTypes }}
            {{- end }}
            {{- if include "cockpit.isSet" .Values.storage.downloadHistoryRetentionDays }}
            - name: STACKABLE_COCKPIT_DOWNLOAD_HISTORY_RETENTION_DAYS
              value: {{ include "cockpit.envValue" .Values.storage.downloadHistoryRetentionDays }}
            {{- end }}
            {{- with .Values.bookmarks.global }}
            {{- if not (kindIs "slice" .) }}
            {{- fail "bookmarks.global must be a YAML list of bookmarks; a JSON string is not accepted" }}
            {{- end }}
            - name: STACKABLE_COCKPIT_GLOBAL_BOOKMARKS
              value: {{ toJson . | quote }}
            {{- end }}
            {{- if .Values.trino.queryTtl }}
            - name: STACKABLE_COCKPIT_QUERY_TTL
              value: {{ .Values.trino.queryTtl | int64 |quote }}
            {{- end }}
            {{- if .Values.logging.level }}
            - name: LOG_LEVEL
              value: {{ .Values.logging.level | quote }}
            {{- end }}
            - name: STACKABLE_COCKPIT_SESSION_SECRET
              valueFrom:
                secretKeyRef:
                  {{- if .Values.sessionSecret.secretKeyRef.name }}
                  name: {{ .Values.sessionSecret.secretKeyRef.name | quote }}
                  key: {{ .Values.sessionSecret.secretKeyRef.key | quote }}
                  {{- else }}
                  name: {{ include "cockpit.fullname" . }}
                  key: session-secret
                  {{- end }}
            - name: DATABASE_HOST
              value: {{ required "database.host is required" .Values.database.host | quote }}
            - name: DATABASE_PORT
              value: {{ include "cockpit.databasePort" . | quote }}
            - name: DATABASE_NAME
              value: {{ .Values.database.name | quote }}
            - name: DATABASE_USER
              value: {{ .Values.database.user | quote }}
            - name: DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ required "database.password.secretKeyRef.name is required" .Values.database.password.secretKeyRef.name | quote }}
                  key: {{ .Values.database.password.secretKeyRef.key | quote }}
            {{- with .Values.database.tls.mode }}
            - name: DATABASE_TLS_MODE
              value: {{ . | quote }}
            {{- end }}
            {{- if .Values.database.tls.caCert }}
            - name: DATABASE_TLS_CA_CERT
              value: {{ .Values.database.tls.caCert | quote }}
            {{- else if .Values.database.tls.secretClass }}
            - name: DATABASE_TLS_CA_CERT
              value: /stackable/database-tls/ca.crt
            {{- end }}
            {{- if eq (toString (index $features "storage" | default dict).enabled) "true" }}
            - name: STORAGE_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ required "storage.encryptionKey.secretKeyRef.name is required when features.storage.enabled is true" .Values.storage.encryptionKey.secretKeyRef.name | quote }}
                  key: {{ .Values.storage.encryptionKey.secretKeyRef.key | quote }}
            {{- end }}
            {{- if .Values.storage.tls.caCert }}
            - name: STACKABLE_COCKPIT_STORAGE_TLS_CA_CERT
              value: {{ .Values.storage.tls.caCert | quote }}
            {{- else if .Values.storage.tls.secretClass }}
            - name: STACKABLE_COCKPIT_STORAGE_TLS_CA_CERT
              value: /stackable/storage-tls/ca.crt
            {{- end }}
            {{- if .Values.auth.oidc.enabled }}
            - name: STACKABLE_COCKPIT_OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ required "auth.oidc.clientSecret.secretKeyRef.name is required when OIDC is enabled" .Values.auth.oidc.clientSecret.secretKeyRef.name | quote }}
                  key: {{ .Values.auth.oidc.clientSecret.secretKeyRef.key | quote }}
            {{- end }}
            - name: STACKABLE_COCKPIT_BASE_URL
              valueFrom:
                configMapKeyRef:
                  name: {{ include "cockpit.fullname" . }}
                  key: base-url
            {{- if .Values.origin }}
            - name: ORIGIN
              valueFrom:
                configMapKeyRef:
                  name: {{ include "cockpit.fullname" . }}
                  key: origin
            {{- end }}
            {{- with .Values.proxy.protocolHeader }}
            - name: PROTOCOL_HEADER
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.proxy.hostHeader }}
            - name: HOST_HEADER
              value: {{ . | quote }}
            {{- end }}
            {{- if .Values.auth.oidc.enabled }}
            - name: STACKABLE_COCKPIT_OIDC_DISCOVERY_URL
              valueFrom:
                configMapKeyRef:
                  name: {{ include "cockpit.fullname" . }}
                  key: oidc-discovery-url
            - name: STACKABLE_COCKPIT_OIDC_CLIENT_ID
              valueFrom:
                configMapKeyRef:
                  name: {{ include "cockpit.fullname" . }}
                  key: oidc-client-id
            - name: STACKABLE_COCKPIT_TRINO_USER_CLAIM
              value: {{ .Values.trino.userImpersonation.userClaim | quote }}
            {{- with .Values.auth.oidc.extraScopes }}
            - name: STACKABLE_COCKPIT_OIDC_EXTRA_SCOPES
              value: {{ join " " . | quote }}
            {{- end }}
            {{- end }}
            {{- if .Values.trino.url }}
            - name: STACKABLE_COCKPIT_TRINO_URL
              valueFrom:
                configMapKeyRef:
                  name: {{ include "cockpit.fullname" . }}
                  key: trino-url
            {{- end }}
            {{- if .Values.trino.publicUrl }}
            - name: STACKABLE_COCKPIT_TRINO_PUBLIC_URL
              valueFrom:
                configMapKeyRef:
                  name: {{ include "cockpit.fullname" . }}
                  key: trino-public-url
            {{- end }}
            {{- if .Values.trino.auth.type }}
            - name: STACKABLE_COCKPIT_TRINO_AUTH_TYPE
              valueFrom:
                configMapKeyRef:
                  name: {{ include "cockpit.fullname" . }}
                  key: trino-auth-type
            {{- end }}
            {{- if .Values.trino.auth.username }}
            - name: STACKABLE_COCKPIT_TRINO_AUTH_USERNAME
              valueFrom:
                configMapKeyRef:
                  name: {{ include "cockpit.fullname" . }}
                  key: trino-auth-username
            {{- end }}
            {{- if eq .Values.trino.auth.type "basic" }}
            - name: STACKABLE_COCKPIT_TRINO_AUTH_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ required "trino.auth.password.secretKeyRef.name is required for basic auth" .Values.trino.auth.password.secretKeyRef.name | quote }}
                  key: {{ .Values.trino.auth.password.secretKeyRef.key | quote }}
            {{- end }}
            - name: STACKABLE_COCKPIT_TRINO_USER_IMPERSONATION
              value: {{ .Values.trino.userImpersonation.enabled | quote }}
            {{- if .Values.trino.tls.insecure }}
            - name: STACKABLE_COCKPIT_TRINO_TLS_INSECURE
              value: "true"
            {{- end }}
            {{- if .Values.trino.tls.caCert }}
            - name: STACKABLE_COCKPIT_TRINO_TLS_CA_CERT
              value: {{ .Values.trino.tls.caCert | quote }}
            {{- else if .Values.trino.tls.secretClass }}
            - name: STACKABLE_COCKPIT_TRINO_TLS_CA_CERT
              value: /stackable/trino-tls/ca.crt
            {{- end }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- with .Values.extraEnvFrom }}
          envFrom:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            {{- if .Values.trino.tls.secretClass }}
            - name: trino-tls
              mountPath: /stackable/trino-tls
              readOnly: true
            {{- end }}
            {{- if .Values.database.tls.secretClass }}
            - name: database-tls
              mountPath: /stackable/database-tls
              readOnly: true
            {{- end }}
            {{- if .Values.storage.tls.secretClass }}
            - name: storage-tls
              mountPath: /stackable/storage-tls
              readOnly: true
            {{- end }}
            {{- with .Values.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
      volumes:
        - name: tmp
          emptyDir:
            {{- with .Values.tmp.sizeLimit }}
            {{- /* A plain number arrives as float64 and would render as 1e+09. */}}
            sizeLimit: {{ if kindIs "float64" . }}{{ int64 . }}{{ else }}{{ . | quote }}{{ end }}
            {{- else }} {}
            {{- end }}
        {{- if .Values.trino.tls.secretClass }}
        - name: trino-tls
          ephemeral:
            volumeClaimTemplate:
              metadata:
                annotations:
                  secrets.stackable.tech/class: {{ .Values.trino.tls.secretClass | quote }}
                  secrets.stackable.tech/scope: pod
              spec:
                storageClassName: secrets.stackable.tech
                accessModes:
                  - ReadWriteOnce
                resources:
                  requests:
                    storage: 1
        {{- end }}
        {{- if .Values.database.tls.secretClass }}
        - name: database-tls
          ephemeral:
            volumeClaimTemplate:
              metadata:
                annotations:
                  secrets.stackable.tech/class: {{ .Values.database.tls.secretClass | quote }}
                  secrets.stackable.tech/scope: pod
              spec:
                storageClassName: secrets.stackable.tech
                accessModes:
                  - ReadWriteOnce
                resources:
                  requests:
                    storage: 1
        {{- end }}
        {{- if .Values.storage.tls.secretClass }}
        - name: storage-tls
          ephemeral:
            volumeClaimTemplate:
              metadata:
                annotations:
                  secrets.stackable.tech/class: {{ .Values.storage.tls.secretClass | quote }}
                  secrets.stackable.tech/scope: pod
              spec:
                storageClassName: secrets.stackable.tech
                accessModes:
                  - ReadWriteOnce
                resources:
                  requests:
                    storage: 1
        {{- end }}
        {{- with .Values.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
