# Proxy-injected chrome (iframe-spike §4.9 level 3): a small stock-nginx proxy in front of the
# Trino coordinator that injects a <script> before </head>. The script neutralises Trino's
# `target="_blank"` drill-down links (query/stage/plan/worker) so they navigate INSIDE the
# Cockpit iframe instead of popping unbranded new tabs.
#
# The Trino ingress points here (http) instead of at the coordinator directly; nginx re-encrypts
# to Trino's HTTPS and forwards the Host / X-Forwarded-Proto Trino needs to build its OAuth2
# redirect_uri. The injection keys on a generic DOM pattern, not Trino's URL grammar -> stable
# across releases, no source patch.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: trino-chrome-nginx
  namespace: default
data:
  nginx.conf: |
    worker_processes 1;
    events { worker_connections 1024; }
    http {
      server {
        listen 8080;
        server_name trino.sdp.test;

        location / {
          proxy_pass https://trino-coordinator.default.svc.cluster.local:8443;
          proxy_ssl_verify off;
          proxy_ssl_server_name on;
          proxy_http_version 1.1;

          proxy_set_header Host trino.sdp.test;
          proxy_set_header X-Forwarded-Proto https;
          proxy_set_header X-Forwarded-Host trino.sdp.test;
          proxy_set_header X-Forwarded-For $remote_addr;
          # Disable upstream compression so sub_filter can rewrite the HTML body.
          proxy_set_header Accept-Encoding "";

          # Inject the target-stripping script before </head> on every HTML response.
          sub_filter_once off;
          sub_filter_types text/html;
          sub_filter '</head>' '<script>(function(){function tc(){var m=document.cookie.match(/(?:^|; )cockpit_theme=([a-z]+)/);return m?m[1]:null;}function ap(t){document.documentElement.style.backgroundColor=t==="dark"?"#1b1b1b":"";}ap(tc());window.addEventListener("message",function(e){if(e.data&&e.data.type==="cockpit-theme"){ap(e.data.theme);}},false);function s(){var a=document.querySelectorAll("a[target=_blank]"),i;for(i=0;i<a.length;i++){a[i].removeAttribute("target");}}document.addEventListener("click",function(e){var x=e.target;var a=x&&x.closest?x.closest("a[target=_blank]"):null;if(a){a.removeAttribute("target");}},true);if(window.MutationObserver){new MutationObserver(s).observe(document.documentElement,{childList:true,subtree:true});}document.addEventListener("DOMContentLoaded",s);})();</script></head>';
        }
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: trino-chrome
  namespace: default
  labels: { app: trino-chrome }
spec:
  replicas: 1
  selector:
    matchLabels: { app: trino-chrome }
  template:
    metadata:
      labels: { app: trino-chrome }
    spec:
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          ports:
            - containerPort: 8080
          volumeMounts:
            - name: conf
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
              readOnly: true
      volumes:
        - name: conf
          configMap: { name: trino-chrome-nginx }
---
apiVersion: v1
kind: Service
metadata:
  name: trino-chrome
  namespace: default
spec:
  selector: { app: trino-chrome }
  ports:
    - name: http
      port: 8080
      targetPort: 8080
