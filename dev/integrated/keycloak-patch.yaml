# Strategic-merge patch (integrated mode): give Keycloak a stable public issuer at
# https://idp.corp.test regardless of access path, and trust the ingress's forwarded
# proto/host headers. env is merged by name, so the bootstrap admin vars are preserved.
spec:
  template:
    spec:
      containers:
        - name: keycloak
          env:
            - name: KC_HOSTNAME
              value: https://idp.corp.test
            - name: KC_HOSTNAME_STRICT
              value: 'false'
            - name: KC_PROXY_HEADERS
              value: xforwarded
            - name: KC_HTTP_ENABLED
              value: 'true'
